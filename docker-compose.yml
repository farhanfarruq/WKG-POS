version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pos-warkop-app
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      # Kita menggunakan anonymous volumes untuk mencegah overwrite direktori spesifik oleh host
      # jika folder tersebut kosong di host
      - /var/www/html/vendor
      - /var/www/html/node_modules
    environment:
      - APACHE_RUN_USER=www-data
      - APACHE_RUN_GROUP=www-data
    restart: unless-stopped
